<svg xmlns="http://www.w3.org/2000/svg" width="920" height="430" viewBox="0 0 920 430" role="img" aria-labelledby="title desc">
  <title id="title">Waveform wrapper interface</title>
  <desc id="desc">Illustration of how JenpyROQ passes parameters and frequency settings to wrapper classes and receives waveform polarizations.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#00626a"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#111820" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="920" height="430" rx="12" fill="#f3f6fb"/>
  <text x="38" y="48" font-family="Lato, Arial, sans-serif" font-size="24" font-weight="800" fill="#161616">Waveform wrapper interface</text>
  <text x="38" y="75" font-family="Lato, Arial, sans-serif" font-size="14" fill="#5f6572">Wrappers isolate optional waveform libraries from the ROQ construction logic.</text>

  <g filter="url(#shadow)" font-family="Lato, Arial, sans-serif">
    <rect x="48" y="126" width="190" height="164" rx="8" fill="#ffffff" stroke="#dde4ef"/>
    <text x="78" y="158" font-size="16" font-weight="800" fill="#00626a">JenpyROQ state</text>
    <text x="78" y="189" font-size="12" fill="#29313d">parameter dictionary</text>
    <text x="78" y="208" font-size="12" fill="#29313d">deltaF, f_min, f_max</text>
    <text x="78" y="227" font-size="12" fill="#29313d">distance scale</text>
    <text x="78" y="246" font-size="12" fill="#29313d">approximant name</text>

    <rect x="318" y="116" width="244" height="184" rx="10" fill="#edf7f8" stroke="#9ed5da"/>
    <text x="366" y="150" font-size="17" font-weight="800" fill="#073f45">Wrapper registry</text>
    <text x="355" y="181" font-size="12" fill="#29313d">WfWrapper[approximant]</text>
    <rect x="352" y="207" width="176" height="52" rx="6" fill="#ffffff" stroke="#dde4ef"/>
    <text x="380" y="230" font-size="13" font-weight="800" fill="#00626a">generate_waveform</text>
    <text x="386" y="249" font-size="11" fill="#5f6572">returns hp, hc arrays</text>

    <rect x="660" y="86" width="198" height="52" rx="8" fill="#ffffff" stroke="#dde4ef"/>
    <text x="692" y="117" font-size="14" font-weight="800" fill="#00626a">LALSimulation</text>
    <rect x="660" y="153" width="198" height="52" rx="8" fill="#ffffff" stroke="#dde4ef"/>
    <text x="704" y="184" font-size="14" font-weight="800" fill="#7d3d00">TEOBResumS</text>
    <rect x="660" y="220" width="198" height="52" rx="8" fill="#ffffff" stroke="#dde4ef"/>
    <text x="711" y="251" font-size="14" font-weight="800" fill="#2868a9">MLGW-BNS</text>
    <rect x="660" y="287" width="198" height="52" rx="8" fill="#ffffff" stroke="#dde4ef"/>
    <text x="700" y="318" font-size="14" font-weight="800" fill="#2d7a58">bajes / NRPMw</text>
  </g>

  <g stroke="#00626a" stroke-width="2.6" fill="none" marker-end="url(#arrow)">
    <path d="M238 208 H306"/>
    <path d="M562 208 C600 118 628 112 650 112"/>
    <path d="M562 208 C602 179 624 179 650 179"/>
    <path d="M562 208 C602 246 624 246 650 246"/>
    <path d="M562 208 C600 318 628 313 650 313"/>
  </g>

</svg>
